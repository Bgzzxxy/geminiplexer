<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Precise Directional Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.2px; }
    .subtitle { font-size: 12px; fill: #64748B; }
    .block-title { font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .block-sub { font-size: 11px; fill: #94A3B8; }
    .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .lane-text { font-size: 11px; fill: #64748B; font-weight: 500; }
  </style>

  <!-- Frame Background -->
  <rect width="1120" height="420" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Technical Top Header Bar -->
  <g transform="translate(40, 36)">
    <rect width="20" height="20" rx="4" fill="#1E293B" stroke="#334155"/>
    <text class="mono" font-size="11" font-weight="700" fill="#38BDF8" x="5" y="14">G</text>
    <text class="sans title" x="32" y="15">Geminiplexer System Architecture</text>
    <text class="mono subtitle" x="290" y="15">|  Go Bare-Metal Gateway  |  Port 4981</text>
  </g>

  <g transform="translate(850, 28)">
    <rect width="105" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text class="mono tag" x="52" y="16" text-anchor="middle" fill="#38BDF8">RAM &lt; 20 MB</text>
    <rect x="115" width="115" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text class="mono tag" x="172" y="16" text-anchor="middle" fill="#10B981">ZERO DOCKER</text>
  </g>

  <line x1="40" y1="68" x2="1080" y2="68" stroke="#1E293B" stroke-width="1"/>

  <!-- ==================== COLUMN 1: CLIENT PROTOCOL INGESTION ==================== -->
  <g transform="translate(40, 92)">
    <text class="mono tag" fill="#64748B">01. INGESTION INTERFACES</text>

    <!-- Block A: OpenAI -->
    <g transform="translate(0, 18)">
      <rect width="260" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text class="mono" font-size="11" font-weight="600" fill="#38BDF8" x="16" y="26">POST /v1/chat/completions</text>
      <text class="sans block-sub" x="16" y="46">OpenAI Wire Protocol (SSE &amp; Sync)</text>
      <line x1="16" y1="58" x2="244" y2="58" stroke="#1E293B"/>
      <text class="mono" font-size="10" fill="#64748B" x="16" y="76">• Cursor / Windsurf / Aider</text>
      <text class="mono" font-size="10" fill="#64748B" x="16" y="94">• Open-WebUI / 9router</text>
    </g>

    <!-- Block B: Anthropic -->
    <g transform="translate(0, 148)">
      <rect width="260" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text class="mono" font-size="11" font-weight="600" fill="#818CF8" x="16" y="26">POST /v1/messages</text>
      <text class="sans block-sub" x="16" y="46">Anthropic Claude Messages Protocol</text>
      <line x1="16" y1="58" x2="244" y2="58" stroke="#1E293B"/>
      <text class="mono" font-size="10" fill="#64748B" x="16" y="76">• Claude Code CLI</text>
      <text class="mono" font-size="10" fill="#64748B" x="16" y="94">• Cline / RooCode (VS Code)</text>
    </g>
  </g>

  <!-- Connectors: Ingestion -> Core -->
  <path d="M 300, 165 L 360, 165 L 380, 205 L 410, 205" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 300, 295 L 360, 295 L 380, 255 L 410, 255" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>

  <!-- ==================== COLUMN 2: GEMINIPLEXER CORE ENGINE ==================== -->
  <g transform="translate(420, 92)">
    <text class="mono tag" fill="#38BDF8">02. CORE ROUTING PIPELINE</text>

    <rect y="18" width="320" height="240" rx="8" fill="#0D1322" stroke="#25334D" stroke-width="1.5"/>

    <g transform="translate(16, 36)">
      <!-- Unit 1 -->
      <rect width="288" height="42" rx="4" fill="#131C31" stroke="#1E293B"/>
      <text class="sans block-title" x="12" y="20">Protocol Normalizer &amp; Tool Bridge</text>
      <text class="mono" font-size="10" fill="#64748B" x="12" y="34">JSON Schema Injection &amp; Delta Slicer</text>

      <!-- Unit 2 -->
      <rect y="52" width="288" height="48" rx="4" fill="#131C31" stroke="#38BDF8" stroke-width="1.2"/>
      <text class="sans block-title" fill="#F8FAFC" x="12" y="72">LRU Pooler &amp; Anti-Burst Cooldown</text>
      <text class="mono" font-size="10" fill="#38BDF8" x="12" y="88">Min 2s inter-request spacing per account</text>

      <!-- Unit 3 -->
      <rect y="110" width="288" height="48" rx="4" fill="#131C31" stroke="#F59E0B" stroke-width="1.2"/>
      <text class="sans block-title" fill="#F8FAFC" x="12" y="130">Downgrade Quarantine Circuit Breaker</text>
      <text class="mono" font-size="10" fill="#F59E0B" x="12" y="146">Detects silent Flash fallback -> 15m quarantine</text>

      <!-- Unit 4 -->
      <rect y="168" width="288" height="42" rx="4" fill="#131C31" stroke="#1E293B"/>
      <text class="sans block-title" x="12" y="188">RotateCookies Session Refresher</text>
      <text class="mono" font-size="10" fill="#64748B" x="12" y="202">Background jittered cookie rotation (±10%)</text>
    </g>
  </g>

  <!-- Connectors: Core -> Google Web RPC -->
  <path d="M 740, 160 L 780, 160 L 800, 140 L 830, 140" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 740, 215 L 830, 215" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 740, 270 L 780, 270 L 800, 290 L 830, 290" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- ==================== COLUMN 3: GOOGLE GEMINI TARGETS ==================== -->
  <g transform="translate(840, 92)">
    <text class="mono tag" fill="#64748B">03. UPSTREAM RPC TARGETS</text>

    <!-- Target 1: Argon -->
    <g transform="translate(0, 18)">
      <rect width="240" height="68" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
      <text class="mono" font-size="11" font-weight="700" fill="#F59E0B" x="14" y="24">gemini-4-argon</text>
      <text class="mono" font-size="10" fill="#94A3B8" x="14" y="42">ID: 95a4c0abcba24364</text>
      <text class="mono" font-size="9" fill="#64748B" x="14" y="58">Flagship Reasoning &amp; Architecture</text>
    </g>

    <!-- Target 2: Pro -->
    <g transform="translate(0, 96)">
      <rect width="240" height="68" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text class="mono" font-size="11" font-weight="700" fill="#E2E8F0" x="14" y="24">gemini-3.1-pro</text>
      <text class="mono" font-size="10" fill="#94A3B8" x="14" y="42">ID: e6fa609c3fa255c0</text>
      <text class="mono" font-size="9" fill="#64748B" x="14" y="58">Deep Code Analysis &amp; Large Context</text>
    </g>

    <!-- Target 3: Flash -->
    <g transform="translate(0, 174)">
      <rect width="240" height="74" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text class="mono" font-size="11" font-weight="700" fill="#10B981" x="14" y="22">gemini-3.8-flash &amp; Lite</text>
      <text class="mono" font-size="10" fill="#94A3B8" x="14" y="38">ID: 56fdd199312815e2</text>
      <text class="mono" font-size="9" fill="#64748B" x="14" y="54">High-Throughput Generalist Tier</text>
      <text class="mono" font-size="9" fill="#10B981" x="14" y="66">Failover Target on Quota Depletion</text>
    </g>
  </g>

  <!-- Technical Bottom Status Line -->
  <line x1="40" y1="365" x2="1080" y2="365" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(40, 390)">
    <circle cx="4" cy="4" r="3" fill="#10B981"/>
    <text class="mono" font-size="10" fill="#64748B" x="16" y="7">STATUS: PRODUCTION READY  |  BATExecute RPC: otAQ7b  |  StreamGenerate: Lamda.BardFrontendService</text>
  </g>
</svg>

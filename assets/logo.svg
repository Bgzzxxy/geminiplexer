<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="#0B0F19"/>
  <rect x="1" y="1" width="254" height="254" rx="47" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Schematic Alignment Axes -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 4">
    <line x1="32" y1="128" x2="224" y2="128"/>
    <line x1="128" y1="32" x2="128" y2="224"/>
    <circle cx="128" cy="128" r="72" fill="none"/>
  </g>

  <!-- Input Buses (Left: 3 pooled account lines) -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 40,80 L 80,80 L 108,108 L 120,120"/>
    <path d="M 32,128 L 116,128"/>
    <path d="M 40,176 L 80,176 L 108,148 L 120,136"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="40" cy="80" r="3"/>
    <circle cx="32" cy="128" r="3"/>
    <circle cx="40" cy="176" r="3"/>
  </g>

  <!-- Output Buses (Right: 2 protocol lines - OpenAI & Anthropic) -->
  <g stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 136,120 L 148,108 L 176,80 L 216,80"/>
    <path d="M 136,136 L 148,148 L 176,176 L 216,176"/>
  </g>
  <g fill="#818CF8">
    <circle cx="216" cy="80" r="3"/>
    <circle cx="216" cy="176" r="3"/>
  </g>

  <!-- Central Multiplexer Core (Precise Rhombus Star) -->
  <path d="M 128,72 L 138,118 L 184,128 L 138,138 L 128,184 L 118,138 L 72,128 L 118,118 Z"
        fill="#0F172A"
        stroke="#F8FAFC"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Center Pin -->
  <circle cx="128" cy="128" r="4.5" fill="#38BDF8"/>
</svg>

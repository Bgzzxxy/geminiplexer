<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0F0F17" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Star Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Bus Line Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filter for subtle crisp glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#27273A" stroke-width="2.5"/>

  <!-- Subtle Circuit Grid Backdrop -->
  <g opacity="0.12" stroke="#A5B4FC" stroke-width="1.5" stroke-dasharray="4 8">
    <circle cx="256" cy="256" r="180" fill="none"/>
    <circle cx="256" cy="256" r="120" fill="none"/>
    <line x1="76" y1="256" x2="436" y2="256"/>
    <line x1="256" y1="76" x2="256" y2="436"/>
  </g>

  <!-- Multiplexer Input Bus (3 accounts on Left) -->
  <g stroke="url(#inputGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Lane -->
    <path d="M 96,176 L 160,176 L 206,222 L 230,240"/>
    <!-- Center Lane -->
    <path d="M 80,256 L 226,256"/>
    <!-- Bottom Lane -->
    <path d="M 96,336 L 160,336 L 206,290 L 230,272"/>
  </g>

  <!-- Multiplexer Output Bus (Dual protocol on Right) -->
  <g stroke="url(#outputGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Lane (OpenAI) -->
    <path d="M 282,240 L 306,222 L 352,176 L 416,176"/>
    <!-- Bottom Lane (Anthropic) -->
    <path d="M 282,272 L 306,290 L 352,336 L 416,336"/>
  </g>

  <!-- Port Terminal Nodes -->
  <g fill="#38BDF8">
    <circle cx="96" cy="176" r="5"/>
    <circle cx="80" cy="256" r="5"/>
    <circle cx="96" cy="336" r="5"/>
  </g>
  <g fill="#EC4899">
    <circle cx="416" cy="176" r="5"/>
    <circle cx="416" cy="336" r="5"/>
  </g>

  <!-- Core Gemini Hypocycloid Prism Star (Clean Geometric Vector) -->
  <g filter="url(#coreGlow)">
    <path d="M 256,128 
             C 256,198 212,256 128,256 
             C 212,256 256,314 256,384 
             C 256,314 300,256 384,256 
             C 300,256 256,198 256,128 Z"
          fill="url(#geminiGrad)"
          stroke="#FFFFFF"
          stroke-width="1.5"
          stroke-opacity="0.8"/>
  </g>

  <!-- Inner Diamond Facet Highlights -->
  <path d="M 256,190 L 222,256 L 256,322 L 290,256 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.25"
        stroke="#FFFFFF" 
        stroke-width="1" 
        stroke-opacity="0.6"/>

  <!-- Core Quantum Center Point -->
  <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>
</svg>

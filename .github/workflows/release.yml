name: Release Multiplatform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            ext: ".exe"
            archive: zip
          - os: windows
            arch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="gemini-relay${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "dist/${OUTPUT_NAME}" ./cmd/server

      - name: Package Release
        run: |
          mkdir -p release_staging
          cp "dist/gemini-relay${{ matrix.ext }}" release_staging/
          cp accounts.example.yaml release_staging/
          cp README.md release_staging/
          cp LICENSE release_staging/

          if [ "${{ matrix.os }}" = "windows" ]; then
            cp scripts/start.bat release_staging/
            cd release_staging
            zip -r "../gemini-relay-${{ matrix.os }}-${{ matrix.arch }}.zip" .
          else
            if [ "${{ matrix.os }}" = "darwin" ]; then
              cp launchd/com.gemini-relay.plist release_staging/
            fi
            if [ "${{ matrix.os }}" = "linux" ]; then
              cp systemd/gemini-to-api.service release_staging/
            fi
            cd release_staging
            tar -czvf "../gemini-relay-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-relay-${{ matrix.os }}-${{ matrix.arch }}
          path: gemini-relay-${{ matrix.os }}-${{ matrix.arch }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
